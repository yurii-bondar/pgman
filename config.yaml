# ============================================================================
# pgman — production-ready sample config
# ============================================================================
# Every duration accepts Go's time.Duration syntax: "30s", "5m", "1h".
# Unset (zero) values fall back to defaults from Config.applyDefaults —
# only the values you actually want to override need to appear here.
# ----------------------------------------------------------------------------

# ---- Network / TLS ---------------------------------------------------------

listen_addr: ":6435"                        # Postgres wire (data plane)
metrics_addr: ":8080"                       # Prometheus /metrics only (public-safe)
admin_addr: "127.0.0.1:8081"                # Admin UI + pool CRUD (loopback only unless auth is set below)

# certs/ is gitignored and ships empty. For local development generate a
# self-signed localhost pair with `scripts/gen-dev-certs.sh`; in
# production point these at your real certificate and key.
tls_cert_file: "certs/server.crt"
tls_key_file: "certs/server.key"

# ---- Client-facing auth (Postgres clients) ---------------------------------

# Never a plaintext password — see `pgman -gen-scram-verifier <password>`,
# or copy straight from `SELECT rolpassword FROM pg_authid` on a real Postgres.
auth_users:
  rgs: "SCRAM-SHA-256$4096:PDleUJSqWGThS77n6IaYiQ==$suBycl9o9+u6tHTq5XCcL9ZepPhAut3KA/Dtdi1wgOM=:zUnH1fzQ1MM7+8Lru2+voRbOK5s8OKumgunqoyfrq5E="

# Roles allowed into the PgBouncer-compatible admin console (the virtual
# `admin_database`, default "pgbouncer"). Empty ⇒ nobody, which is the
# default: that console can PAUSE every pool and SHOW CLIENTS lists every
# tenant's sessions, so passing client auth must not be enough to reach it.
# admin_users:
#   - ops

# ---- Admin-facing auth (HTTP admin UI) -------------------------------------

# Required whenever admin_addr is bound to a non-loopback interface.
# Generate hash with: `pgman -gen-admin-password '<pwd>'`
# admin_basic_auth_user: "admin"
# admin_basic_auth_password_hash: "$2a$12$..."

# ---- Admin TLS / mTLS -------------------------------------------------
# Enabling admin_tls_cert_file+admin_tls_key_file switches the admin
# listener to HTTPS. Adding admin_tls_client_ca_file additionally
# enables mutual TLS: any client presenting a certificate signed by
# the CA bundle bypasses Basic/OIDC and is authenticated by cert.
# admin_mtls_allowed_cns is an optional CN allowlist — empty ⇒ any
# cert issued by the CA is accepted.
# admin_tls_cert_file: "/etc/pgman/admin.crt"
# admin_tls_key_file:  "/etc/pgman/admin.key"
# admin_tls_client_ca_file: "/etc/pgman/ops-ca.crt"
# admin_mtls_allowed_cns:
#   - "ops-alice"
#   - "ops-bob"

# ---- Admin OIDC (Bearer token) ---------------------------------------
# Verifies id_tokens from the given OpenID Provider. At least one of
# allowed_emails / allowed_subjects must be non-empty when OIDC is
# enabled — otherwise anyone with a valid token from the issuer walks
# in, which is never intended.
# admin_oidc_issuer_url: "https://accounts.google.com"
# admin_oidc_client_id:  "pgman-admin.apps.googleusercontent.com"
# admin_oidc_allowed_emails:
#   - "alice@example.com"
# admin_oidc_allowed_subjects: []
# admin_oidc_skip_email_verified: false      # keep false unless IDP omits the claim

# enable_pprof: true                        # net/http/pprof under admin auth

# ---- Data-plane limits & timeouts ------------------------------------------

max_client_conn: 10000                      # cap on concurrent client conns (0 = unlimited — unsafe)
client_login_timeout: "60s"                 # startup+auth deadline; defends against slowloris
query_wait_timeout: "120s"                  # max Acquire wait on saturated pool
server_reset_query: "DISCARD ALL"           # session-state scrub between clients

# Skip the scrub when the pool hands a connection straight back to the
# session that just released it. Saves two round trips per transaction (the
# DISCARD, plus the tracked-parameter replay that restores what it wiped),
# and with a LIFO pool a serial client hits this case almost every time.
#
# Off by default, and the cost is determinism rather than isolation — a
# different client never sees another's state either way. With it on, a
# session-level SET survives into the next transaction whenever the pool
# returns the same connection and is lost when it doesn't, so an app can
# appear to get away with session state until load starts moving
# connections between clients. Turn it on when your clients treat each
# transaction as independent, which transaction pooling asks of them anyway.
#
# Where it pays: the skip only fires when a session gets its own connection
# back, so the win shrinks as clients oversubscribe the pool. Measured on a
# laptop against a Docker Postgres (15s runs, pool=50): +72% QPS with one
# serial client, +18% at 4 clients, +13% at 20, and nothing measurable at
# 100 — there a released connection is taken by a waiter before its owner
# can reacquire it.
server_reset_query_skip_same_session: false

# How many named prepared statements stay prepared on one backend connection,
# as an LRU — the same meaning the setting has in PgBouncer. Past the cap the
# least recently used statement is closed on that backend and re-prepared from
# the session's own record the next time it is used, so nothing is lost.
#
# Budget it against Postgres' plan cache: cap x average statement size, per
# pooled connection. Setting it at or above your driver's statement-cache size
# (pgx defaults to 512) means the steady state never re-prepares anything.
#
# A session may hold 4x this many statements at once; a client past that is
# disconnected with SQLSTATE 54000, because a session with thousands of live
# statement names is leaking them rather than caching them.
max_prepared_statements: 200                # 0 = default (200), negative = no cap

tcp_keepalive: "30s"                        # detect vanished peers instead of leaking FDs

# How long a SCRAM pass-through pool may sit unused before it is closed.
# These pools cannot be declared here — one is created per role the first
# time that role connects — so without a ceiling a long-lived process ends up
# holding a pool, its connections and a reaper goroutine for every role that
# has ever connected, including roles since dropped from the cluster.
# Reclaiming one costs that role a single dial when it comes back.
scram_passthrough_idle_timeout: "30m"       # 0 = default (30m), negative = keep forever

# The four ways a client can hold a backend without doing work, and the
# ceiling on each. Unset takes a generous default (15m / 30m / 5m / 60s) that
# bounds a leak without policing normal traffic; the tighter values below are
# a starting point for a workload you know. A negative value disables one
# explicitly, which is the honest way to say "no ceiling" — an unset field
# cannot be told apart from a zero one in YAML.
query_timeout: "60s"                        # max time one statement may run; negative = unlimited.
                                            #   Does NOT apply to COPY or replication streams.
                                            #   Raise it if you run long reports through the proxy.
client_idle_timeout: "30m"                  # close a client that is connected but silent outside a transaction
idle_transaction_timeout: "5m"              # close a client idle *inside* an open transaction.
                                            #   The dangerous one: such a client pins a backend
                                            #   AND holds its locks and snapshot.
client_write_timeout: "60s"                 # max time one write towards a client may block.
                                            #   Without it a peer that stopped reading parks the
                                            #   relay goroutine — and its backend — in write(2)
                                            #   until TCP gives up, which is minutes.

# ---- Backend failure handling ----------------------------------------------

# After this many consecutive dial failures the pool stops trying and
# fails fast, until the cooldown elapses and one probe is let through.
# Clients get a retryable error (SQLSTATE 08006), not a dropped
# connection. Enabled by default; set threshold to -1 to disable.
circuit_breaker_threshold: 5
circuit_breaker_cooldown: "5s"

# ---- Pool lifecycle defaults (override per-pool below) ---------------------

server_idle_timeout: "10m"                  # close pooled conn if idle longer
server_lifetime: "1h"                       # close pooled conn if older, enables silent credential rotation
server_check_delay: "30s"                   # skip healthcheck for fresh idle conns
server_login_retry: 3                       # extra dial attempts on failure
server_login_backoff: "200ms"               # initial dial-retry backoff
min_pool_size: 0                            # warm-up target per pool
health_check_timeout: "500ms"

# ---- HTTP server timeouts (metrics + admin listeners) ----------------------

http_read_header_timeout: "5s"
http_read_timeout: "30s"
# http_write_timeout intentionally omitted — admin serves SSE (long-lived);
# override it if you split /metrics onto its own restrictive listener.
http_idle_timeout: "60s"

# ---- Logging ---------------------------------------------------------------

log_format: "json"                          # "json" for production, "text" for dev
log_level: "info"                           # debug/info/warn/error

# ---- Pools -----------------------------------------------------------------

# Refuse to start a pool whose DSN does not mandate TLS. Without this,
# a typo in sslmode silently downgrades proxy→Postgres traffic — and
# credentials — to plain text, and nothing tells you.
require_backend_tls: true

pools:
  shop:
    # Never commit a real password here. Keep this file free of secrets
    # and inject the DSN from your secret store / environment at deploy
    # time; the placeholders below exist to be replaced.
    backend_dsn: "postgres://REPLACE_USER:REPLACE_PASSWORD@localhost:5432/shop?sslmode=verify-full"
    backend_addr: "localhost:5432"
    limit: 20
    min_idle: 2                             # keep 2 conns warm at all times

    # Give individual roles their own backend credentials, so a client
    # authenticated as alice also runs as alice on Postgres. Without this
    # every client shares the backend_dsn role whatever it logged in as,
    # and GRANT/REVOKE, row-level security and pg_stat_activity all stop
    # telling your clients apart.
    #
    # Pools are keyed by the identity they dial with: users listed here
    # each get their own pool (visible as "backoffice/alice" in metrics
    # and SHOW POOLS), everyone else keeps sharing the backend_dsn one.
    # Budget a pool per listed user, each up to `limit` connections.
    #
    # A full DSN, not a password, so the secret need not live in this
    # file: use passfile= for a .pgpass, or sslcert=/sslkey= for
    # certificate auth with no password at all.
    # backend_users:
    #   alice: "postgres://alice@localhost:5432/backoffice?sslmode=verify-full&passfile=/etc/pgman/pgpass"

    # Or let every client bring its own credential. With scram_passthrough
    # the ClientKey recovered from a client's SCRAM handshake with pgman is
    # reused to authenticate to Postgres as that same role — nothing to
    # configure per user, nothing on disk, and users resolved through
    # auth_query are covered too.
    #
    # Requires pgman's verifier for a user to be the backend's verifier,
    # because ClientKey derives from its salt and iteration count. Copying
    # rolpassword into auth_users (as above) or pointing auth_query at this
    # backend's pg_shadow makes that automatic; anything else fails with a
    # message saying so.
    #
    # The cost: pgman then keeps a password-equivalent in memory for every
    # user that has logged in, instead of only verifiers. Clients using
    # trust, peer or cert auth have no ClientKey and keep sharing the
    # backend_dsn role.
    # scram_passthrough: true
    # idle_timeout, max_lifetime, etc. inherit top-level defaults unless set here

  analytics:
    backend_dsn: "postgres://REPLACE_USER:REPLACE_PASSWORD@localhost:5433/analytics?sslmode=verify-full"
    backend_addr: "localhost:5433"
    limit: 20
    min_idle: 2
